
parameters:
  - name: runAsPublic
    type: boolean
    default: false
  - name: buildScript
    type: string
  - name: buildConfig
    type: string
  - name: repoArtifactsPath
    type: string
  - name: repoLogPath
    type: string
  - name: repoTestResultsPath
    type: string
  - name: isWindows
    type: string
    default: false    
  - name: dotnetScript
    type: string
  - name: runHelixTests
    type: boolean
    default: false

steps:

  # Note: don't use the UseDotNet@2 task to install the .NET SDK.
  #
  # It honors global.json's "rollForward" policy, so it may install a different SDK than the
  # exact version Arcade requires (global.json's "tools.dotnet"). When that happens Arcade
  # installs a second SDK into $(Build.SourcesDirectory)/.dotnet, while DOTNET_ROOT keeps
  # pointing at the one from the tool cache. The workloads then get installed into one SDK
  # while Roslyn's MSBuildWorkspace (which resolves the SDK via DOTNET_ROOT) uses the other,
  # so the design-time builds in the tests resolve no references and find no types.
  #
  # Instead let the build script install the SDK, and point every step at that single
  # installation, so that the build, the workloads and the tests all use the same SDK.
  - pwsh: |
      Write-Host "##vso[task.setvariable variable=DOTNET_INSTALL_DIR]$(Build.SourcesDirectory)/.dotnet"
      Write-Host "##vso[task.setvariable variable=DOTNET_ROOT]$(Build.SourcesDirectory)/.dotnet"
    displayName: Use a single .NET installation

  - ${{ if ne(parameters.isWindows, 'true') }}:
    - script: ${{ parameters.buildScript }}
              -restore -build
              -configuration ${{ parameters.buildConfig }}
              /p:ArchiveTests=true
              /bl:${{ parameters.repoLogPath }}build.binlog
              $(_OfficialBuildArgs)
              -p:Platform=`uname -m`
      displayName: 🛠️ Build
  
  - ${{ if eq(parameters.isWindows, 'true') }}:
    - script: ${{ parameters.buildScript }}
              -restore -build
              -configuration ${{ parameters.buildConfig }}
              /p:ArchiveTests=true
              /bl:${{ parameters.repoLogPath }}build.binlog
              $(_OfficialBuildArgs)
      displayName: 🛠️ Build

  - ${{ if or(ne(parameters.runAsPublic, 'true'), ne(parameters.runHelixTests, 'true')) }}:
    - pwsh: |
        # Install the workloads into the same .NET SDK that the build and the tests use.
        ${{ parameters.dotnetScript }} workload install macos ios maccatalyst tvos maui --version 8.0.402.0 # Neccessary for tests

        # List installed workloads
        ${{ parameters.dotnetScript }} workload list
      displayName: Install workloads

    - ${{ if ne(parameters.isWindows, 'true') }}:
      - script: ${{ parameters.dotnetScript }} dotnet-coverage collect
                --settings $(Build.SourcesDirectory)/eng/CodeCoverage.config
                --output ${{ parameters.repoTestResultsPath }}/NonHelix.cobertura.xml
                "${{ parameters.buildScript }} -testnobuild -test -configuration ${{ parameters.buildConfig }} /bl:${{ parameters.repoLogPath }}tests.binlog $(_OfficialBuildArgs) -p:Platform=`uname -m`"
        displayName: Run non-helix tests

  - ${{ if eq(parameters.runHelixTests, 'true') }}:
    - task: CopyFiles@2
      inputs:
        Contents: '${{ parameters.repoArtifactsPath }}/helixresults/**/*.trx'
        TargetFolder: '${{ parameters.repoArtifactsPath }}/log/$(_BuildConfig)/TestResults'
        flattenFolders: true
        OverWrite: true
      displayName: Gather helix trx files
      continueOnError: true
      condition: always()

  - task: CopyFiles@2
    inputs:
      Contents: '${{ parameters.repoArtifactsPath }}/**/*.cobertura.xml'
      TargetFolder: '${{ parameters.repoArtifactsPath }}/CodeCoverage'
      flattenFolders: true
    displayName: Gather code coverage results

  - ${{ if eq(parameters.runAsPublic, 'true') }}:
    - task: PublishPipelineArtifact@1
      displayName: Publish coverage results (cobertura.xml)
      inputs:
        targetPath: '${{ parameters.repoArtifactsPath }}/CodeCoverage'
        artifactName: '$(Agent.JobName)_CodeCoverageResults'
        publishLocation: 'pipeline'

  - ${{ if ne(parameters.runAsPublic, 'true') }}:
    - task: 1ES.PublishPipelineArtifact@1
      displayName: Publish code coverage results
      inputs:
        targetPath: '${{ parameters.repoArtifactsPath }}/CodeCoverage'
        artifactName: '$(Agent.JobName)_CodeCoverageResults'

  # Run on windows, for internal pipeline, or public+non-helix-tests job
  - ${{ if and(eq(parameters.isWindows, 'true'), or(ne(parameters.runAsPublic, 'true'), ne(parameters.runHelixTests, 'true'))) }}:
    - script: ${{ parameters.buildScript }}
              -pack 
              -sign $(_SignArgs)
              -publish $(_PublishArgs)
              -configuration ${{ parameters.buildConfig }}
              /bl:${{ parameters.repoLogPath }}/pack.binlog
              /p:Restore=false /p:Build=false
              $(_OfficialBuildArgs)
      displayName: Pack, Sign & Publish
